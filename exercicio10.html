<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio 9</title>
    <link rel="stylesheet" type="text/css" href="Style/style.css">
    <style>
        .menu{
            background-color: aqua;
            height: 100px;
            width: 100%;
        }
        .esq{
            background-color: yellow;
            height: 400px;
            width: 350px;
            float: left;
            margin: 20px;
        }
        .meio{
            background-color:green;
            height: 400px;
            width: 350px;
            float: left;
            margin: 20px;
        }
        .dir{
            background-color: rgb(255, 192, 254);
            height: 400px;
            width: 350px;
            float: left;
            margin: 20px;
        }
        .roda{
            background-color: red;
            height: 60px;
            width: 100%;
        }
        .clear{
            clear:both;
        }
    </style>
</head>
<body>
    <header>
        <div class="menu">
            Menu
        </div>
    </header>
    <main>
        <div class="esq">
            Esquerda
        </div>
        <div class="meio">
            Meio
        </div>
        <div class="dir">
            Direita
        </div>
        <div class="clear"></div>
    </main>
    <footer>
        <div class="roda">
            Rodapé
        </div>
    </footer>
</body>
</html>
